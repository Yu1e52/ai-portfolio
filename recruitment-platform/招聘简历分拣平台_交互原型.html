<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles={admin:'平台管理员',manager:'招聘经理',hr:'招聘专员',department:'用人部门'},demoLabel=x=>({'demo.manager':'招聘经理','demo.hr.tech':'技术专员','demo.hr.product':'产品专员','demo.dept.tech':'技术部门','demo.dept.product':'产品部门','demo.admin':'平台管理员'}[x.username]||x.name.replace(/^演示/,'')),opinions={yes:'符合',partial:'部分符合',no:'不符合',unknown:'待核实'},decisions={pass:'通过',fail:'未通过',more:'待补充'};
let user=null,token='',data={jobs:[],candidates:[],referrals:[],feedbacks:[],users:[],audit:[]},service={},setupRequired=false,demoMode=false,demoUsers=[],page='',cid=null,refId=null,detailTab='material',detailAnalysis=null,busy=false,query='',filterJob='all',compareStage='面试后',toastTimer,drawerFocus=null,importBatch=[],importBatchMode=false,importBatchId='';
const is=r=>user?.role===r,job=id=>data.jobs.find(j=>j.id===id),candidate=id=>data.candidates.find(c=>c.id===id),version=(j,id)=>j?.versions.find(v=>v.id===id)||j?.versions.at(-1),latest=(c,v)=>c.analyses.filter(a=>a.version===v).at(-1),review=(c,v)=>c.reviews.filter(r=>r.version===v).at(-1),time=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'—';
const btn=(text,action,extra='',style='')=>`<button class="btn ${style}" data-action="${action}" ${extra}>${text}</button>`,pill=(text,style='')=>`<span class="pill ${style}">${safe(text)}</span>`,empty=text=>`<div class="empty">${text}</div>`,head=(title,desc,actions='')=>`<div class="head"><div><div class="eyebrow">RECRUITMENT WORKSPACE</div><h1>${title}</h1><p>${desc}</p></div><div class="row">${actions}</div></div>`,stat=(title,value,note)=>`<div class="stat"><span>${title}</span><b>${safe(value)}</b><small>${note}</small></div>`,lines=t=>t.split('\n').map(s=>s.trim()).filter(Boolean);

function error(form,text){$('.error',form).hidden=false;$('.error',form).textContent=text;}
async function api(path,payload){const opts=payload===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(payload)};const r=await fetch(path,opts);let d;try{d=await r.json();}catch{throw Error('服务未返回有效内容，请保持启动窗口开启。');}if(!r.ok){if(r.status===401){busy=false;user=null;cid=null;refId=null;detailAnalysis=null;data={jobs:[],candidates:[],referrals:[],feedbacks:[],users:[],audit:[]};$('#drawer').innerHTML='';$('#drawer').hidden=true;$('#overlay').hidden=true;$('#modal').close();document.body.style.overflow='';await boot();}throw Error(d.error||'操作未完成。');}return d;}
function allowedPages(){return is('admin')?[['users','用户管理'],['permissions','角色与数据范围']]:is('manager')?[['overview','招聘概览'],['jobs','岗位与专员分配'],['candidates','候选材料'],['feedback','部门反馈'],['compare','结果对照'],['permissions','角色与数据范围']]:is('hr')?[['candidates','简历与 AI 评分'],['jobs','我的招聘岗位'],['feedback','推荐与反馈'],['compare','结果对照'],['permissions','角色与数据范围']]:[['feedback','待评估推荐'],['jobs','相关岗位要求'],['permissions','角色与数据范围']];}
async function boot(){
 if(!/^https?:$/.test(location.protocol)){$('#app').innerHTML='<div class="auth"><h1>启动多账号与 DeepSeek 服务</h1><p class="muted">请双击同目录的“启动DeepSeek评分.cmd”，在启动窗口输入 API Key，然后在浏览器打开 http://127.0.0.1:8772/ 。账号与权限需要本机服务，不能只通过双击 HTML 运行。</p><p class="muted">不配置密钥也可先启动服务，建立账号和招聘流程；真实 AI 评分需要密钥。</p></div>';return;}
 try{const a=await api('/api/auth');token=a.token;user=a.user;setupRequired=a.setupRequired;demoMode=a.demoMode;demoUsers=a.demoUsers||[];if(demoMode&&demoUsers.length&&!demoUsers.some(x=>x.id===user?.id))user=null;if(!user&&demoMode&&demoUsers.length){await api('/api/demo/switch',{username:demoUsers[0].username});const selected=await api('/api/auth');user=selected.user;}if(!user)return renderAuth();await reload();}catch(e){$('#app').innerHTML=`<div class="auth"><h1>服务未连接</h1><p class="muted">请稍后重试；若持续失败，请联系管理员。</p><div class="error">${safe(e.message)}</div></div>`;}
}
function renderAuth(){page='';$('#app').innerHTML=`<header class="top"><div class="brand"><span class="symbol">R</span>企业招聘协作平台</div><small>公网练习环境 · 需登录</small></header><div class="auth"><div class="eyebrow">${setupRequired?'PLATFORM SETUP':'WELCOME BACK'}</div><h1>${setupRequired?'创建首个平台管理员':'登录招聘协作平台'}</h1><p class="muted">${setupRequired?'管理员负责创建招聘经理、招聘专员及用人部门账号。不会预设或公开默认密码。':'使用管理员创建的账号登录。角色和可见数据由服务端权限控制。'}</p><form id="auth-form">${setupRequired?'<label class="field"><span>管理员姓名 *</span><input name="name" required maxlength="60" autocomplete="name"></label>':''}<label class="field"><span>账号 *</span><input name="username" required pattern="[A-Za-z0-9_.-]{3,60}" autocomplete="username" placeholder="3–60 位英文、数字、点或横线"></label><label class="field"><span>${setupRequired?'设置密码（至少10位）':'密码'} *</span><input type="password" name="password" required ${setupRequired?'minlength="10"':''} maxlength="128" autocomplete="${setupRequired?'new-password':'current-password'}"></label><div class="error" role="alert" hidden></div><button class="btn primary" type="submit">${setupRequired?'创建管理员，进入登录':'登录'}</button></form><p class="tiny" style="margin-top:18px">仅使用虚构演示数据；数据存于服务器 SQLite，密钥不写入数据库或网页；尚未部署企业云。</p></div>`;}
async function reload(){if(!user)return;data=await api('/api/data');service=await api('/api/status');if(!allowedPages().some(x=>x[0]===page))page=allowedPages()[0][0];if(cid&&!candidate(cid))closeDrawer();render();if(cid)renderDetail();}
function render(){const scope=is('admin')?'账号与配置；不含简历及业务数据':is('manager')?'本人管理的岗位、专员分配及招聘结果':is('hr')?'分配给本人的岗位与相关简历':`仅推荐给 ${user.department} 的材料及引用版本`;
 $('#app').innerHTML=`<header class="top"><div class="brand"><span class="symbol">R</span>企业招聘协作平台 <small>PRACTICE · DEEPSEEK</small></div><div class="top-right"><span class="who">${safe(user.name)} · ${roles[user.role]}</span>${btn('刷新数据','refresh')}${demoMode?'':btn('退出登录','logout')}</div></header>${demoMode?`<div class="demo-banner demo-bar"><span class="demo-tag">演示模式</span><div class="role-tabs" role="tablist" aria-label="切换演示角色">${demoUsers.map(x=>`<button class="role-tab ${x.id===user.id?'active':''}" role="tab" aria-selected="${x.id===user.id}" data-action="demo-role" data-username="${safe(x.username)}" title="${safe(x.name)} · ${roles[x.role]}${x.department?' · '+safe(x.department):''}">${safe(demoLabel(x))}</button>`).join('')}</div><span class="demo-hint">点击角色即切换，无需账号密码</span></div>`:''}<div class="layout"><aside><div class="identity"><b>${safe(user.name)}</b><small>${roles[user.role]}${user.department?' · '+safe(user.department):''}</small><p class="tiny" style="margin-top:9px">${safe(user.username)}</p></div><div class="scope-note">数据范围：${safe(scope)}。${demoMode?'点击顶部角色即可切换视角；当前为虚构演示数据。':'角色权限由当前登录账号确定。'}</div><div class="nav-label">${is('admin')?'平台管理':'招聘工作空间'}</div><nav>${allowedPages().map(([id,title])=>`<button class="nav ${page===id?'active':''}" data-action="nav" data-page="${id}">${title}</button>`).join('')}</nav><p class="tiny" style="margin:35px 12px">AI 只提供辅助评分。<br>任何分数均保留人工判断。<br>低分材料不删除、不自动淘汰。</p></aside><main class="main">${({users:usersView,permissions:permissionsView,jobs:jobsView,candidates:candidatesView,feedback:feedbackView,overview:overviewView,compare:compareView})[page]()}</main></div><div class="foot">企业内部招聘 · 公网练习环境 · 分数公式与反馈阶段为待确认方案</div>`;
}
function table(headers,rows){return `<div class="table"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
function usersView(){return head('用户管理','平台自有账号；管理员不查看简历、AI 评分或招聘业务数据。',btn('+ 创建账号','new-user','','primary'))+`<div class="notice">停用账号会立即使该账号已有会话失效，保留其历史操作与业务归属。不能停用当前管理员自己。</div><section class="panel">${table(['姓名 / 账号','角色','部门','状态','最近登录','操作'],data.users.map(u=>`<tr><td><b>${safe(u.name)}</b><small>${safe(u.username)}</small></td><td>${roles[u.role]}</td><td>${safe(u.department||'未填写')}</td><td>${pill(u.enabled?'启用':'停用',u.enabled?'green':'red')}</td><td>${safe(time(u.lastLogin))}</td><td>${u.id===user.id?'<span class="tiny">当前账号</span>':btn(u.enabled?'停用':'启用','toggle-user',`data-id="${u.id}" data-enabled="${u.enabled?'0':'1'}"`,'small')}</td></tr>`))}</section><section class="panel"><div class="panel-head"><h2>账号操作记录</h2></div><div class="panel-body">${data.audit.slice().reverse().slice(0,30).map(a=>`<div class="history">${safe(a.by)} · ${safe(a.action)}<small class="tiny"> · ${safe(time(a.at))}</small></div>`).join('')}</div></section>`;}
function permissionsView(){return head('角色与数据范围',demoMode?'演示环境允许一键切换指定虚构账号；切换后服务端仍按当前视角过滤数据。正式系统需恢复身份认证。':'采用真实登录和服务端过滤；浏览器修改角色或记录 ID 不会获得额外权限。')+`<div class="card-grid">${[['admin','创建及启停账号，查看账号审计与模型配置状态；不进入简历业务。'],['manager','建立自己管理的岗位、维护要求版本、分配招聘专员；查看自己岗位的候选、反馈及进度。'],['hr','查看分配给自己的岗位；导入材料、调用 AI、独立审核，并推荐给目标岗位所属部门。'],['department','仅查看明确推荐给本部门的材料与当时引用的岗位版本、AI 和人工意见；填写本部门专业反馈与独立招聘结果。']].map(([r,t])=>`<div class="role-card"><h2>${roles[r]}</h2><p>${t}</p></div>`).join('')}</div><div class="notice warn" style="margin-top:20px">以上是本次练习实现的权限方案，经理管理范围、账号生命周期及正式授权流程仍需评审。岗位调配后原专员立即失去该岗位访问权，历史记录保留。</div>${is('admin')?`<section class="panel"><div class="panel-head"><h2>模型连接配置</h2></div><div class="panel-body"><p>${pill(service.configured?'密钥已配置':'密钥尚未配置',service.configured?'green':'warn')}模型 ${safe(service.model)}</p><p class="muted" style="margin-top:10px">密钥仅在启动窗口中输入或从进程环境读取，不在网页、账号数据库或日志中显示。</p></div></section>`:''}`;}
function jobsView(){return head(is('manager')?'岗位与招聘专员分配':is('hr')?'我的招聘岗位':'相关岗位要求','目标部门与岗位关联，历史版本保留。',is('manager')?btn('+ 新建岗位','new-job','','primary'):'')+`<div class="notice">${is('manager')?'先建立岗位，明确目标部门，再分配给一个招聘专员。一个专员可以负责多个岗位和不同部门。':is('hr')?'这里只显示经理分配给你的岗位。推荐给不同部门时，请选择该部门对应的招聘岗位独立核实。':'仅展示本部门推荐记录引用的岗位要求版本，不释放其他岗位或未推荐材料。'}</div><section class="panel">${data.jobs.length?table(['岗位 / 用人部门','当前要求','招聘专员','名额','操作'],data.jobs.map(j=>{const v=j.versions.at(-1);return `<tr><td><b>${safe(j.name)}</b><small>${safe(j.department)} · ${safe(j.managerName)}</small></td><td class="wrap">${pill(v.label)}${safe(v.requirements.join(' / '))}</td><td>${safe(j.hrName||'尚未分配')}</td><td>${j.headcount===null?'待补充':safe(j.headcount)}</td><td><div class="row">${btn('查看要求','job-detail',`data-id="${j.id}"`,'small')}${is('manager')?btn('分配专员','assign',`data-id="${j.id}"`,'small soft')+btn('新版本','edit-job',`data-id="${j.id}"`,'small'):''}</div></td></tr>`;})):empty(is('manager')?'暂无岗位。管理员需先建立用人部门和招聘专员账号。':is('hr')?'尚未分配招聘岗位，请联系招聘经理。':'暂无本部门推荐关联岗位。')}</section>`;}
function candidateRows(){const cs=data.candidates.filter(c=>(filterJob==='all'||c.jobId===filterJob)&&(!query||(c.name+' '+c.fileName).toLowerCase().includes(query.toLowerCase())));return cs.length?table(['候选材料 / 来源','岗位 / 部门','AI 岗位证据分','人工进度','操作'],cs.map(c=>{const j=job(c.jobId),v=j.versions.at(-1),a=latest(c,v.id),r=review(c,v.id),sent=data.referrals.some(x=>x.reviewId===r?.id);return `<tr><td><button class="link" data-action="detail" data-id="${c.id}">${safe(c.name)}</button><small>${safe(c.source)}${c.duplicate?' · 疑似重复，已保留':''}</small></td><td>${safe(j.name)}<small>${safe(j.department)} · ${safe(v.label)}</small></td><td>${a?pill(a.score===null?'证据待补充':a.score+' / 100',a.score===null?'warn':'green'):c.analysisStatus==='failed'?pill('评分失败','warn'):'<span class="tiny">已导入 · 尚未评分</span>'}<small>${a?safe(a.model):c.analysisStatus==='failed'?safe(c.analysisError||'本次未保存评分'):'不预填模拟分数'}</small></td><td>${pill(sent?'已推荐':r?decisions[r.decision]:'待审核',sent?'green':'')}${r&&r.version!==v.id?pill('要求待核实','warn'):''}</td><td>${btn(is('hr')?'评分 / 审核':'查看材料','detail',`data-id="${c.id}"`,'small')}</td></tr>`;})):empty('当前范围内没有材料。未分配岗位、未导入材料或筛选无结果时显示为空，不等于已淘汰。');}
function candidatesView(){return head(is('hr')?'简历与 AI 评分':'候选材料',is('hr')?'核对岗位证据，保留人工最终判断。':'查看本人管理岗位的候选材料，AI 分仅作参考。',is('hr')?btn('+ 导入简历','import','','primary'):'')+`<div class="notice green">${is('hr')?(service.configured?'DeepSeek 密钥已配置，按候选材料明确提交后才会调用模型。':'DeepSeek 尚未配置密钥。可先导入和人工审核；真实评分需重新启动并输入密钥。'):'AI 分数仅为岗位材料证据意见；不会自动淘汰、删除或录用。'}</div><div class="stats">${stat('候选岗位记录',data.candidates.length,'按材料—岗位记录计数')}${stat('待人工审核',data.candidates.filter(c=>!review(c,job(c.jobId).versions.at(-1).id)).length,'包括未评分、低分和资料不足')}${stat('已形成推荐',data.referrals.length,'人工通过后明确推荐')}${stat('已有部门反馈',data.referrals.filter(r=>data.feedbacks.some(f=>f.referralId===r.id)).length,'无反馈保持未知')}</div><section class="panel"><div class="filters"><input id="search" aria-label="搜索材料" placeholder="搜索材料名称 / 文件名" value="${safe(query)}"><select id="filter-job" aria-label="岗位筛选"><option value="all">全部授权岗位</option>${data.jobs.map(j=>`<option value="${j.id}" ${filterJob===j.id?'selected':''}>${safe(j.name)} · ${safe(j.department)}</option>`).join('')}</select></div><div id="candidate-rows">${candidateRows()}</div></section>`;}
function feedbackStatus(r,stage){const fs=data.feedbacks.filter(f=>f.referralId===r.id&&(!stage||f.stage===stage));if(!fs.length)return {name:'尚无反馈',value:null,conflict:false};const distinct=new Set(fs.map(f=>f.match));return distinct.size>1?{name:'意见争议，待核实',value:null,conflict:true}:{name:opinions[fs.at(-1).match],value:fs.at(-1).match,conflict:false};}
function feedbackView(){return head(is('department')?'待评估推荐':'推荐与部门反馈','专业匹配意见与录用、入职事实分别记录，补充反馈保留历史。')+`<section class="panel">${data.referrals.length?table(['推荐材料','目标岗位 / 部门','推荐上下文','HR 判断','反馈情况','操作'],data.referrals.map(r=>{const c=candidate(r.candidateId),j=job(r.jobId),v=version(j,r.version),hr=c.reviews.find(x=>x.id===r.reviewId),fs=data.feedbacks.filter(f=>f.referralId===r.id),st=feedbackStatus(r,'面试后');return `<tr><td>${safe(c.name)}<small>${safe(r.by)} · ${safe(time(r.at))}</small></td><td>${safe(j.name)}<small>${safe(r.department)}</small></td><td>${pill(v.label)}${j.versions.at(-1).id!==v.id?pill('历史要求保留','warn'):''}</td><td>${safe(opinions[hr?.match]||'未知')}</td><td>${pill(fs.length?fs.length+' 条阶段意见':'尚无反馈',fs.length?'green':'warn')}<small>面试后：${safe(st.name)}</small></td><td>${btn(is('department')?'填写 / 查看反馈':'查看反馈','ref-detail',`data-id="${r.id}"`,'small')}</td></tr>`;})):empty(is('department')?'尚无材料推荐给本部门。其他部门材料不可见。':'尚无明确推荐。人工审核通过不代表已自动发送部门。')}</section>`;}
function hiring(j){const cs=data.candidates.filter(c=>c.jobId===j.id);return cs.map(c=>{const ids=data.referrals.filter(r=>r.candidateId===c.id).map(r=>r.id),fs=data.feedbacks.filter(f=>ids.includes(f.referralId)&&f.confirmed&&f.outcome);return {hired:fs.some(f=>f.outcome==='已入职'),rejected:fs.some(f=>f.outcome==='未录用'),ok:fs.some(f=>f.outcome==='已入职')&&!fs.some(f=>f.outcome==='未录用')};});}
function hired(j){return hiring(j).filter(x=>x.ok).length;}
function hireConflicts(j){return hiring(j).filter(x=>x.hired&&x.rejected).length;}
function overviewView(){return head('招聘概览','本人管理岗位的分配、推荐、反馈、明确入职与缺口。')+`<div class="stats">${stat('管理岗位',data.jobs.length,'仅本人管理范围')}${stat('已分配岗位',data.jobs.filter(j=>j.hrId).length,'可调整负责专员')}${stat('已形成推荐',data.referrals.length,'按推荐记录计数')}${stat('明确已入职',data.jobs.reduce((n,j)=>n+hired(j),0),'确认入职且无未录用冲突')}</div><section class="panel"><div class="panel-head"><h2>岗位推进</h2>${btn('分配招聘专员','nav','data-page="jobs"','soft')}</div>${data.jobs.length?table(['岗位 / 部门','负责专员','候选记录','推荐 / 有反馈','明确入职','计划名额 / 缺口'],data.jobs.map(j=>{const refs=data.referrals.filter(r=>r.jobId===j.id),done=refs.filter(r=>data.feedbacks.some(f=>f.referralId===r.id)).length,count=hired(j),conflicts=hireConflicts(j);return `<tr><td>${safe(j.name)}<small>${safe(j.department)}</small></td><td>${safe(j.hrName||'尚未分配')}</td><td>${data.candidates.filter(c=>c.jobId===j.id).length}</td><td>${refs.length} / ${done}</td><td>${count}${conflicts?pill('另有 '+conflicts+' 条入职/未录用冲突','warn'):''}</td><td>${j.headcount===null?'待补充 / 待补充':safe(j.headcount)+' / '+safe(j.headcount-count)}</td></tr>`;})):empty('暂无管理岗位，请先建立岗位并分配专员。')}</section><div class="notice warn">缺口演示口径为计划名额减明确入职，缺名额不计算；入职与未录用反馈冲突时不计为明确入职，并在对应岗位行标注冲突数。记录数不代表全企业唯一人数。未配置基线，不展示虚构提效比例。</div>`;}
function compareView(){const stageFeedbacks=data.feedbacks.filter(f=>f.stage===compareStage),samples=new Set(stageFeedbacks.map(f=>f.referralId)).size;return head('结果对照','保留 AI、人工审核及部门原意见，不以未录用直接推导筛选错误。')+`<div class="notice">当前阶段反馈 ${stageFeedbacks.length} 条，涉及 ${samples} 条推荐。${stageFeedbacks.length?'仅并列展示同一次推荐的原意见；':'暂无可评价样本；'}分数与部门意见的映射、样本和分母尚未确认，不计算准确率。</div><section class="panel"><div class="panel-head"><h2>按反馈阶段对照</h2><select id="compare-stage" style="max-width:160px" aria-label="对照阶段">${['简历评估','面试后','试岗后'].map(s=>`<option ${s===compareStage?'selected':''}>${s}</option>`).join('')}</select></div>${data.referrals.length?table(['候选 / 岗位','当时 AI 评分','HR 独立匹配判断','部门阶段意见','对照状态','操作'],data.referrals.map(r=>{const c=candidate(r.candidateId),j=job(r.jobId),rv=c.reviews.find(x=>x.id===r.reviewId),a=c.analyses.find(x=>x.id===rv?.analysisId),st=feedbackStatus(r,compareStage);return `<tr><td>${safe(c.name)}<small>${safe(j.name)} · ${safe(version(j,r.version).label)}</small></td><td>${a?(a.score===null?'证据待补充':safe(a.score)+' / 100'):'未引用 AI 结果'}</td><td>${safe(opinions[rv?.match]||'未知')}</td><td>${pill(st.name,st.conflict?'warn':st.value?'green':'')}</td><td>${!st.value?'未知 / 争议不作错误判断':rv?.match==='unknown'?'人工判断仍待核实':st.value===rv?.match?'HR 与部门一致':'存在差异，需核实'}</td><td>${btn('原意见与历史','ref-detail',`data-id="${r.id}"`,'small')}</td></tr>`;})):empty('没有可对照的推荐记录。')}</section>`;}
function modal(title,content){$('#modal-title').textContent=title;$('#modal-body').innerHTML=content;$('#modal').showModal();}
function formFooter(label,cancelAction='close-modal'){return `<div class="error" role="alert" hidden></div><div class="form-actions">${btn('取消',cancelAction)}<button class="btn primary" type="submit">${label}</button></div>`;}
function userForm(){modal('创建平台账号',`<form id="user-form"><div class="two"><label class="field"><span>姓名 *</span><input name="name" required maxlength="60"></label><label class="field"><span>账号 *</span><input name="username" required pattern="[A-Za-z0-9_.-]{3,60}" autocomplete="off"></label></div><label class="field"><span>角色 *</span><select name="role" required><option value="">请选择</option>${Object.entries(roles).map(([r,n])=>`<option value="${r}">${n}</option>`).join('')}</select></label><label class="field"><span>部门（用人部门角色必填）</span><input name="department" maxlength="100" placeholder="同一部门的账号请填写相同部门名称"></label><label class="field"><span>初始密码 * · 至少10位</span><input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><p class="muted">密码在服务器数据库中以加盐哈希保存；本页不会再次显示明文密码。</p>${formFooter('创建账号')}</form>`);}
function jobForm(id){const j=job(id),v=j?.versions.at(-1),depts=[...new Set(data.users.filter(u=>u.role==='department').map(u=>u.department))];modal(j?'保存岗位要求新版本':'新建招聘岗位',`<form id="job-form" data-id="${id||''}"><label class="field"><span>岗位名称 *</span><input name="name" required maxlength="200" value="${safe(j?.name||'')}"></label><label class="field"><span>目标用人部门 *</span><select name="department" required ${j?'disabled':''}><option value="">请选择已创建账号的部门</option>${depts.map(d=>`<option ${j?.department===d?'selected':''}>${safe(d)}</option>`).join('')}</select></label><label class="field"><span>计划名额（可空）</span><input type="number" name="headcount" min="0" step="1" value="${j?.headcount??''}"></label><label class="field"><span>技能要求 * · 每行一项</span><textarea name="requirements" required>${safe(v?.requirements.join('\n')||'')}</textarea></label><label class="field"><span>加分项 · 每行一项</span><textarea name="bonus">${safe(v?.bonus.join('\n')||'')}</textarea></label><label class="field"><span>要求来源 *</span><input name="source" required value="${safe(v?.source||'')}"></label><p class="muted">保存产生新版本，不替换旧分析、审核和推荐。暂无部门选项时请联系管理员创建部门账号。</p>${formFooter('保存岗位')}</form>`);}
function assignForm(id){const j=job(id),hrs=data.users.filter(u=>u.role==='hr'&&u.enabled);modal('分配招聘专员',`<form id="assign-form" data-id="${id}"><label class="field"><span>岗位</span><input readonly value="${safe(j.name+' · '+j.department)}"></label><label class="field"><span>负责招聘专员 *</span><select name="hrId" required><option value="">请选择</option>${hrs.map(u=>`<option value="${u.id}" ${j.hrId===u.id?'selected':''}>${safe(u.name+' · '+u.username)}</option>`).join('')}</select></label><div class="notice warn">重新分配后，原专员即失去该岗位及相关材料访问权，历史处理记录保留。一个岗位本轮由一位专员负责，是练习实现方案。</div>${formFooter('确认分配')}</form>`);}
function importForm(){importBatch=[];importBatchMode=false;modal('为负责岗位导入简历',`<form id="candidate-form"><label class="field"><span>关联招聘岗位 *</span><select name="jobId" required><option value="">请选择本人负责岗位</option>${data.jobs.map(j=>`<option value="${j.id}">${safe(j.name+' · '+j.department)}</option>`).join('')}</select></label><label class="field"><span>材料名称 *</span><input name="name" required maxlength="250" placeholder="使用便于核实的候选编号或材料名"></label><label class="field"><span>来源</span><select name="source"><option>未注明</option><option>邮件</option><option>招聘软件</option><option>校园招聘</option></select></label><label class="field"><span>本机文件（可多选 TXT / 文字型 PDF / DOCX）</span><input id="resume-file" type="file" multiple accept=".txt,.pdf,.docx"></label><p class="tiny">文件先在本机提取正文，不调用模型。10 MB / 50页 / 60,000字符为当前工具限制；扫描件不支持 OCR。</p><label class="field"><span>简历正文 * · 核对后保存</span><textarea name="text" required maxlength="60000" style="min-height:240px" placeholder="可直接粘贴脱敏正文，或选取文件提取"></textarea></label><p class="muted">保存后正文写入服务器数据库。实际评分前还需明确确认向 DeepSeek 发送。</p><div id="extract-state" class="muted"></div><div id="batch-files"></div>${formFooter('保存材料')}</form>`);}
function closeDrawer(){if(busy)return;cid=null;refId=null;detailAnalysis=null;$('#drawer').hidden=true;$('#overlay').hidden=true;document.body.style.overflow='';drawerFocus?.focus?.();}
function openDetail(id,ref=null){drawerFocus=document.activeElement;cid=id;refId=ref;detailTab=ref?'feedback':'material';detailAnalysis=null;renderDetail();$('#drawer').hidden=false;$('#overlay').hidden=false;document.body.style.overflow='hidden';$('.close',$('#drawer')).focus();}
function aiResult(a){return `<p class="muted">分析引用岗位版本：${safe(a.version)}</p><div class="metrics"><div class="metric"><span class="muted">综合证据分</span><b>${safe(a.score??'—')}</b><small class="tiny">${a.score===null?'缺项，暂不合成':'满分100，非录用概率'}</small></div><div class="metric"><span class="muted">技能要求分</span><b>${safe(a.coreScore??'—')}</b></div><div class="metric"><span class="muted">加分项分</span><b>${safe(a.bonusScore??'—')}</b></div></div><p class="muted">${safe(a.model)} · ${safe(time(a.at))} · 原文证据 ${safe(a.evidenceCount)} / ${safe(a.conditionCount)} 项</p><p style="margin:12px 0">${safe(a.summary)}</p>${a.items.map(x=>`<div class="evidence"><b>${x.group==='core'?'技能要求':'加分项'}：${safe(x.requirement)}</b> ${pill(x.score===null?'待补充证据':x.score+' 分',x.score===null?'warn':'green')}<p>${safe(x.reason)}</p>${x.quote?`<div class="quote">${safe(x.quote)}</div>`:''}</div>`).join('')}<h3>人工核实建议</h3><ul>${a.questions.map(q=>`<li>${safe(q)}</li>`).join('')||'<li>继续核实经历真实性及岗位实践深度。</li>'}</ul><p class="tiny">提示词 ${safe(a.promptVersion)} · 口径 ${safe(a.rubric)} · 正文 SHA-256 ${safe(a.resumeHash)}。引文存在不代表经历已证实。</p>`;}
function renderDetail(){const c=candidate(cid);if(!c){closeDrawer();return;}const j=job(c.jobId),ref=refId?data.referrals.find(r=>r.id===refId):null,v=version(j,detailAnalysis?c.analyses.find(a=>a.id===detailAnalysis)?.version:ref?.version),rv=ref?c.reviews.find(r=>r.id===ref.reviewId):review(c,v.id),a=detailAnalysis?c.analyses.find(a=>a.id===detailAnalysis):ref?c.analyses.find(a=>a.id===rv?.analysisId):latest(c,v.id);
 let body='';
 if(detailTab==='material')body=`<div class="two"><section><h3>岗位要求 · ${safe(v.label)}</h3><div class="history"><b>技能要求</b><ul>${v.requirements.map(t=>`<li>${safe(t)}</li>`).join('')}</ul><b>加分项</b><ul>${v.bonus.map(t=>`<li>${safe(t)}</li>`).join('')||'<li>未设置</li>'}</ul><p class="tiny">来源：${safe(v.source)}</p></div></section><section><h3>原始简历正文</h3><div class="resume">${safe(c.text)}</div><p class="tiny">${safe(c.fileName)} · ${safe(c.source)}${c.batchId?' · 批次 '+safe(c.batchId):''}</p></section></div>`;
 if(detailTab==='ai')body=`${is('hr')&&!ref&&!detailAnalysis?`<section class="panel"><div class="panel-body"><h3>调用 DeepSeek 真实评分</h3><p class="muted">仅按当前岗位 ${safe(v.label)} 条件分析；不会自动设定高低匹配等级，不影响人工结论。</p><label class="check"><input id="ai-consent" type="checkbox" ${busy?'disabled':''}><span>我确认可以将本页完整简历正文、岗位技能要求及加分项发送至 DeepSeek 官方 API（api.deepseek.com）。请求可能产生费用。</span></label><div class="row">${btn(busy?'DeepSeek 正在分析……':c.analysisStatus==='failed'?'重新调用 DeepSeek 评分':'调用 DeepSeek 评分','analyze',busy||!service.configured?'disabled':'','primary')}</div><p id="busy-note">${busy?'请保持页面开启，其他操作暂时锁定，已有评分不会被失败请求覆盖。':service.configured?'密钥已配置，未点击不会调用。':'密钥尚未配置，请重新运行启动脚本并输入。'}</p><details><summary class="muted">查看练习评分口径（待确认）</summary><p class="muted">逐项0–100分评估岗位材料证据程度；技能组和加分组分别等权，有加分项时占80%和20%，无加分项则技能占100%。缺少证据项为未知，不记零；任一条件缺证据时暂不合成综合分。无自动分类或淘汰阈值。</p></details></div></section>`:''}${a?aiResult(a):c.analysisStatus==='failed'?`<div class="notice warn"><b>上次评分失败，本次未保存分数</b><p>${safe(c.analysisError||'未取得可解析的模型结果。')}</p><small class="tiny">${safe(c.analysisAttemptBy||'')} · ${safe(time(c.analysisAttemptAt))}；旧评分、人工审核和部门反馈均未被改写。核对密钥、网络或模型返回后可重新评分。</small></div>`:empty('已导入，尚无本次上下文的真实 AI 结果。缺少 AI 结果也可以由 HR 独立审核。')}`;
 if(detailTab==='review')body=`${is('hr')&&!ref?`<form id="review-form" data-id="${c.id}" data-version="${v.id}"><div class="two"><label class="field"><span>人工审核结论 *</span><select name="decision" required><option value="">请选择，不默认通过</option>${Object.entries(decisions).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label><label class="field"><span>独立岗位匹配判断 *</span><select name="match" required><option value="">请选择，未知可选待核实</option>${Object.entries(opinions).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label></div><label class="field"><span>人工判断依据 *</span><textarea name="reason" required></textarea></label><div class="notice green">所有分数均可人工通过；资料不足可选待补充。保存新审核记录，不覆盖原 AI 和审核历史。</div>${formFooter('保存人工审核','close-drawer')}</form>`:''}<h3>本上下文人工结论</h3>${rv?`<div class="history">${pill(decisions[rv.decision],'green')}${pill(opinions[rv.match])}<p>${safe(rv.reason)}</p><small class="tiny">${safe(rv.by)} · ${safe(time(rv.at))}</small></div>`:empty('尚无人工结论')}<h3 style="margin-top:20px">明确推荐给用人部门</h3>${is('hr')&&!ref?`<div class="history"><p>目标岗位：${safe(j.name)} · 接收部门：<b>${safe(j.department)}</b></p><p class="muted">${(()=>{const sent=data.referrals.some(r=>r.reviewId===rv?.id);return sent?'本次审核已推荐；重复提交会被拒绝。':'只有当前要求版本人工通过后，才能明确推荐；不会自动发邮件或招聘软件消息。'+btn('推荐给 '+safe(j.department),'recommend',`data-id="${c.id}" data-dept="${safe(j.department)}" ${rv?.decision==='pass'?'':'disabled'}`,'primary')})()}</p><p class="tiny" style="margin-top:10px">推荐其他部门时，回到材料导入选择自己负责的该部门岗位，按相应要求独立审核。</p></div>`:empty(ref?'当前为原推荐上下文，保留原人工结论。':'当前角色只读，不代替 HR 审核或推荐。')}`;
 if(detailTab==='feedback'){
  const refs=data.referrals.filter(r=>r.candidateId===c.id),selected=ref||refs.at(-1),fs=selected?data.feedbacks.filter(f=>f.referralId===selected.id):[];
  body=selected?`<div class="notice">本次推荐至 ${safe(selected.department)}，引用 ${safe(version(j,selected.version).label)} 及当时 HR 审核，反馈不覆盖 AI。</div>`:empty('尚未形成推荐，部门不可见，也不能填写反馈。');
  if(selected&&is('department'))body+=`<form id="feedback-form" data-id="${selected.id}"><div class="two"><label class="field"><span>反馈阶段 *</span><select name="stage" required><option value="">请选择</option>${['简历评估','面试后','试岗后'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field"><span>专业匹配意见 *</span><select name="match" required><option value="">请选择，不默认符合</option>${Object.entries(opinions).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label></div><label class="field"><span>专业判断依据 *</span><textarea name="reason" required></textarea></label><div class="two"><label class="field"><span>招聘结果（独立选填）</span><select name="outcome"><option value="">不补充结果</option>${['面试通过','试岗中','未录用','已入职'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field"><span>结果事实日期</span><input type="date" name="occurred"></label></div><label class="check"><input type="checkbox" name="confirmed"><span>招聘结果已经人工核实；确认已入职须填写日期。</span></label>${formFooter('保存部门反馈','close-drawer')}</form>`;
  body+='<h3 style="margin-top:20px">反馈与招聘结果历史</h3>'+fs.slice().reverse().map(f=>`<div class="history"><b>${safe(f.stage)}</b> ${pill(opinions[f.match])}<p>${safe(f.reason)}</p>${f.outcome?`<p>独立结果：${safe(f.outcome)} · ${f.confirmed?'已核实':'未核实'} ${safe(f.occurred)}</p>`:''}<small class="tiny">${safe(f.by)} · ${safe(time(f.at))}</small></div>`).join('');
  if(selected&&['简历评估','面试后','试岗后'].some(s=>feedbackStatus(selected,s).conflict))body+='<div class="notice warn">同阶段存在不同匹配意见，保留为争议，不默认取最新意见。请经理与用人部门核实；协调定稿流程待确认，本轮不自动消除争议。</div>';
 }
 if(detailTab==='history')body='<h3>AI 评分历史</h3>'+c.analyses.slice().reverse().map(a=>`<div class="history">${safe(time(a.at))} · ${safe(version(j,a.version).label)} · ${safe(a.score??'证据待补充')}<div class="row">${btn('查看原结果','analysis-detail',`data-id="${a.id}"`,'small')}</div></div>`).join('')+'<h3 style="margin-top:20px">人工审核历史</h3>'+c.reviews.slice().reverse().map(r=>`<div class="history">${safe(version(j,r.version).label)} · ${safe(decisions[r.decision])} · ${safe(opinions[r.match])}<p>${safe(r.reason)}</p><small class="tiny">${safe(r.by)} · ${safe(time(r.at))}</small></div>`).join('')+'<h3 style="margin-top:20px">处理记录</h3>'+c.events.slice().reverse().map(e=>`<div class="history">${safe(e.text)}<small class="tiny"> · ${safe(e.by)} · ${safe(time(e.at))}</small></div>`).join('');
 $('#drawer').innerHTML=`<div class="drawer-head"><div><div class="eyebrow">CANDIDATE WORKSPACE</div><h2 id="drawer-title">${safe(c.name)}</h2><p class="muted">${safe(j.name)} · ${safe(j.department)} · ${safe(v.label)}${ref?' · 原推荐上下文':''}</p></div><button class="close" data-action="close-drawer" aria-label="关闭候选详情" ${busy?'disabled':''}>×</button></div><div class="drawer-body">${j.versions.at(-1).id!==v.id?'<div class="notice warn">这里保留历史岗位要求，不自动替换已推荐上下文。</div>':''}<div class="tabs">${[['material','原材料与要求'],['ai','AI 评分'],['review','HR 审核与推荐'],['feedback','部门反馈'],['history','处理历史']].filter(([id])=>!is('department')||id!=='history').map(([id,t])=>`<button class="tab ${detailTab===id?'active':''}" data-action="detail-tab" data-tab="${id}" ${busy?'disabled':''}>${t}</button>`).join('')}</div>${body}</div>`;
}
async function mutate(path,payload,message){await api(path,payload);$('#modal').close();await reload();toast(message);}
async function switchDemo(username){if(busy||!demoUsers.some(x=>x.username===username))return;try{const response=await api('/api/demo/switch',{username});closeDrawer();if($('#modal').open)$('#modal').close();user=response.user;page='';cid=null;refId=null;detailAnalysis=null;query='';filterJob='all';await reload();toast('已切换为 '+user.name+'；现在用该角色查看数据。');}catch(err){toast(err.message);}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const act=el.dataset.action;if(busy&&!['close-modal'].includes(act))return;
 try{
 if(act==='nav'){closeDrawer();page=el.dataset.page;if(allowedPages().some(p=>p[0]===page))render();window.scrollTo({top:0,behavior:'instant'});}
 if(act==='refresh')await reload();
 if(act==='demo-role')await switchDemo(el.dataset.username);
 if(act==='logout'){await api('/api/logout',{});closeDrawer();user=null;data={jobs:[],candidates:[],referrals:[],feedbacks:[],users:[],audit:[]};await boot();}
 if(act==='new-user')userForm();
 if(act==='toggle-user'){const u=data.users.find(u=>u.id===el.dataset.id),enabled=el.dataset.enabled==='1';modal(enabled?'启用账号':'停用账号',`<form id="status-form" data-id="${u.id}" data-enabled="${enabled?'1':'0'}"><p style="margin-top:20px">${safe(u.name)} · ${safe(u.username)}</p><p class="muted">${enabled?'启用后可以使用原账号密码登录。':'停用后该账号的当前会话立即失效；历史操作记录继续保留。'}</p>${formFooter(enabled?'确认启用':'确认停用')}</form>`);}
 if(act==='new-job')jobForm();if(act==='edit-job')jobForm(el.dataset.id);if(act==='assign')assignForm(el.dataset.id);
 if(act==='job-detail'){const j=job(el.dataset.id);modal('岗位要求与分配历史',j.versions.slice().reverse().map(v=>`<div class="history"><b>${safe(j.name)} · ${safe(v.label)}</b><p>技能：${safe(v.requirements.join(' / '))}</p><p>加分项：${safe(v.bonus.join(' / ')||'未提供')}</p><small class="tiny">来源 ${safe(v.source)} · ${safe(v.by)} · ${safe(time(v.at))}</small></div>`).join('')+(j.assignments||[]).slice().reverse().map(a=>`<div class="history">分配：${safe(a.from)} → ${safe(a.to)}<small class="tiny"> · ${safe(a.by)} · ${safe(time(a.at))}</small></div>`).join(''));}
 if(act==='import')importForm();if(act==='close-modal')$('#modal').close();if(act==='close-drawer')closeDrawer();
 if(act==='detail')openDetail(el.dataset.id);if(act==='ref-detail'){const r=data.referrals.find(r=>r.id===el.dataset.id);openDetail(r.candidateId,r.id);}
 if(act==='detail-tab'){detailTab=el.dataset.tab;detailAnalysis=null;renderDetail();}
 if(act==='analysis-detail'){detailAnalysis=el.dataset.id;detailTab='ai';renderDetail();}
 if(act==='recommend')await mutate('/api/referrals',{candidateId:el.dataset.id,department:el.dataset.dept},'已明确推荐给目标部门，未发送外部消息。');
 if(act==='analyze'){
  if(!$('#ai-consent')?.checked)return toast('请先明确确认发送本页岗位和简历正文至 DeepSeek。');
  const target=cid;busy=true;renderDetail();try{await api('/api/analyze',{candidateId:target,consent:true});toast('DeepSeek 结果已新增保存；HR 和部门意见未被改写。');}finally{busy=false;await reload();}
 }
 }catch(err){toast(err.message);}
});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const form=e.target;if(form.dataset.extracting==='1')return toast('正文仍在提取，请完成后保存。');const fd=new FormData(form),obj=Object.fromEntries(fd);$$('button[type="submit"]',form).forEach(b=>b.disabled=true);
 try{
 if(form.id==='auth-form'){if(setupRequired){await api('/api/setup',obj);setupRequired=false;renderAuth();toast('管理员已创建，请使用刚设置的账号密码登录。');}else{await api('/api/login',obj);await boot();}return;}
 if(form.id==='user-form')await mutate('/api/users',obj,'账号已创建，可使用其独立登录。');
 if(form.id==='status-form')await mutate('/api/users/status',{id:form.dataset.id,enabled:form.dataset.enabled==='1'},'账号状态已更新，停用账号的已有登录已失效。');
 if(form.id==='job-form'){const old=job(form.dataset.id);await mutate('/api/jobs',{...obj,id:old?.id,department:old?.department||obj.department,requirements:lines(obj.requirements),bonus:lines(obj.bonus),headcount:obj.headcount===''?null:Number(obj.headcount)},'岗位要求已保存；历史分析和推荐保留。');}
 if(form.id==='assign-form')await mutate('/api/assign',{jobId:form.dataset.id,hrId:obj.hrId},'招聘专员分配已生效。');
 if(form.id==='candidate-form'){
  if(importBatchMode){let saved=0;const failed=[];for(const entry of importBatch){if(entry.error){failed.push(entry);continue;}try{await api('/api/candidates',{jobId:obj.jobId,name:entry.name,fileName:entry.name,source:obj.source,text:entry.text,batchId:importBatchId});saved++;}catch(err){failed.push({...entry,error:err.message});}}importBatch=failed;await reload();if(failed.length){$('#batch-files').innerHTML=failed.map(x=>'<div class="history">'+safe(x.name)+'：'+safe(x.error)+'</div>').join('');error(form,'已保存 '+saved+' 份，'+failed.length+' 份未保存。成功材料不重复提交；请修正失败文件后再选入。');}else{$('#modal').close();toast('已批量保存 '+saved+' 份材料；尚未调用 AI。');}}
  else await mutate('/api/candidates',{...obj,fileName:$('#resume-file').files[0]?.name||'粘贴正文'},'材料已保存，可发起 AI 评分或独立人工审核。');
 }
 if(form.id==='review-form')await mutate('/api/reviews',{...obj,candidateId:form.dataset.id,version:form.dataset.version},'独立人工审核已保存，原 AI 意见及历史未覆盖。');
 if(form.id==='feedback-form')await mutate('/api/feedback',{...obj,referralId:form.dataset.id,confirmed:fd.has('confirmed')},'专业意见及独立招聘结果已保存，原反馈继续保留。');
 }catch(err){if(form.isConnected&&$('.error',form))error(form,err.message);else toast(err.message);}finally{$$('button[type="submit"]',form).forEach(b=>b.disabled=false);}
});
document.addEventListener('change',async e=>{if(e.target.id==='demo-switch'){const selected=e.target.value,previous=user?.username;if(busy||!demoUsers.some(x=>x.username===selected)){e.target.value=previous;return;}try{const response=await api('/api/demo/switch',{username:selected});closeDrawer();if($('#modal').open)$('#modal').close();user=response.user;page='';cid=null;refId=null;detailAnalysis=null;query='';filterJob='all';await reload();toast('已切换为 '+user.name+'；现在展示该视角的数据。');}catch(err){e.target.value=previous;toast(err.message);}return;}if(e.target.id==='filter-job'){filterJob=e.target.value;$('#candidate-rows').innerHTML=candidateRows();}if(e.target.id==='compare-stage'){compareStage=e.target.value;render();}if(e.target.id==='resume-file'){
 const files=[...e.target.files],form=$('#candidate-form');if(!files.length)return;const area=$('[name="text"]',form),status=$('#extract-state'),submit=$('button[type="submit"]',form);area.value='';importBatch=[];importBatchMode=files.length>1;importBatchId=importBatchMode?(crypto.randomUUID?.()||String(Date.now())):'';submit.disabled=true;form.dataset.extracting='1';$('.error',form).hidden=true;
 try{for(const f of files){status.textContent='正在本机提取 '+f.name+' ……';try{if(!f.size||f.size>10*1024*1024)throw Error('文件为空或超过10 MB。');const bytes=new Uint8Array(await f.arrayBuffer());let raw='';for(let i=0;i<bytes.length;i+=16384)raw+=String.fromCharCode(...bytes.subarray(i,i+16384));const r=await api('/api/extract',{name:f.name,content:btoa(raw)});importBatch.push({name:f.name,text:r.text});}catch(err){importBatch.push({name:f.name,error:err.message});}}
 const valid=importBatch.filter(x=>!x.error);if(files.length===1){area.value=valid[0]?.text||'';area.readOnly=false;if(valid[0]&&!$('[name="name"]',form).value)$('[name="name"]',form).value=valid[0].name;}else{area.value=valid.length?'多份文件已逐项提取，保存时每份单独形成材料记录。请在下方展开核对各文件正文。':'';area.readOnly=true;$('[name="name"]',form).value='批次 · '+files.length+' 份文件';}
 $('#batch-files').innerHTML=importBatch.map(x=>'<details class="history"><summary>'+safe(x.name)+' · '+(x.error?'失败':x.text.length+' 字符')+'</summary>'+(x.error?'<p class="error">'+safe(x.error)+'</p>':'<div class="resume">'+safe(x.text)+'</div>')+'</details>').join('');status.textContent='提取成功 '+valid.length+' 份，失败 '+(files.length-valid.length)+' 份。未调用 AI；请核对再保存。';if(!valid.length)error(form,'没有可保存的正文，请选择可读取文件或改为粘贴正文。');
 }finally{submit.disabled=false;form.dataset.extracting='0';}

 }});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#candidate-rows').innerHTML=candidateRows();}});
$('#overlay').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').open)closeDrawer();if(e.key==='Tab'&&!$('#drawer').hidden){const fs=$$('button:not(:disabled),input,textarea,select,a[href]',$('#drawer')).filter(x=>x.offsetParent!==null),first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
boot();
